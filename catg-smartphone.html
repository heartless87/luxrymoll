<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMARTPHONES | luxrymoll.shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

/* Top Title Bar */
.title-bar {
    position: sticky;
    top: 0;
    background: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 10;
}

.title-bar h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 1px;
}

.title-bar button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
}

/* Products */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
    padding: 15px;
}

.product-card {
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    cursor: pointer;
}

.product-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
}

.product-card h4 {
    margin: 8px 0 4px;
    font-size: 14px;
}

.price-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.orig-price {
    color: #999;
    font-size: 13px;
    text-decoration: line-through;
}

.sell-price {
    color: #000;
    font-size: 15px;
    font-weight: bold;
}

/* Loading */
#loading {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<!-- Title Bar -->
<div class="title-bar">
    <h1>SMARTPHONES</h1>
    <button onclick="history.back()">
        <i class="fa fa-xmark"></i>
    </button>
</div>

<!-- Products -->
<div class="products-grid" id="products"></div>
<div id="loading">Loading more products...</div>

<script>
const BACKEND_URL = "https://luxrymoll.vercel.app";
const query = "smartphone";   // 🔥 fixed search keyword
let page = 1;
let loading = false;
let finished = false;

async function loadProducts() {
    if (loading || finished) return;
    loading = true;

    const res = await fetch(
      `${BACKEND_URL}/api/search?q=${query}&page=${page}`
    );
    const data = await res.json();

    if (!data || data.length === 0) {
        finished = true;
        document.getElementById("loading").innerText = "No more products";
        return;
    }

    const container = document.getElementById("products");

    data.forEach(p => {
        const imgSrc = p.images && p.images.length > 0
            ? p.images[0]
            : "/placeholder.png";

        container.innerHTML += `
        <div class="product-card" onclick="location.href='product.html?id=${p._id}'">
            <img src="${imgSrc}" alt="${p.title}">
            <h4>${p.title}</h4>
            <div class="price-row">
                <span class="orig-price">₹${p.originalPrice}</span>
                <span class="sell-price">₹${p.sellingPrice}</span>
            </div>
        </div>`;
    });

    page++;
    loading = false;
}

window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        loadProducts();
    }
});

loadProducts();
</script>

</body>
</html>
