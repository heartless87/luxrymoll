<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luxrymoll.shop/favorites</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        body {
            background: #fff;
            color: #333;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        /* Main container for responsive layout */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            position: relative;
            min-height: 100vh;
            padding-bottom: 70px; /* Space for bottom nav */
        }
        
        header {
            padding: 20px 0;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
        }
        
        .favorites-container {
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .favorite-item {
            background-color: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 16px;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .favorite-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        
        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #f2f2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #8e8e93;
            flex-shrink: 0;
        }
        
        .item-info {
            flex: 1;
            min-width: 0; /* Prevents flex item from overflowing */
        }
        
        .item-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .price-container {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .current-price {
            font-weight: 700;
            font-size: 18px;
            color: #1d1d1f;
        }
        
        .original-price {
            color: #8e8e93;
            text-decoration: line-through;
            font-size: 16px;
        }
        
        .divider {
            height: 1px;
            background-color: #e5e5e7;
            margin: 20px 0;
            position: relative;
        }
        
        .divider::before {
            content: "More Items";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f5f5f7;
            padding: 0 12px;
            font-size: 14px;
            color: #8e8e93;
        }
        
        .heart-icon {
            color: #ff3b30;
            font-size: 20px;
            align-self: flex-start;
            flex-shrink: 0;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        display: flex;
        justify-content: space-around;
        padding: 12px 0;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
        z-index: 1000;
        }
        
        .nav-item {
            text-align: center;
            color: #999;
            font-size: 12px;
        }
        
        .nav-item.active {
            color: #ffb84d;
        }
        
        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
            display: block;
        }
        
        .status-badge {
            background-color: #34c759;
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
        
        .discount-badge {
            background-color: #ff3b30;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 8px;
        }

        /* Grid layout for larger screens */
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Responsive adjustments */
        @media (min-width: 768px) {
            .favorites-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 20px;
            }
            
            .favorite-item {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            
            .item-image {
                width: 100px;
                height: 100px;
                margin: 0 auto;
            }
            
            .item-info {
                width: 100%;
            }
            
            .price-container {
                justify-content: center;
            }
            
            .heart-icon {
                align-self: center;
                margin-top: 10px;
            }
            
            .divider {
                grid-column: 1 / -1;
            }
        }

        @media (min-width: 1024px) {
            .favorites-container {
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 25px;
            }
            
            .favorite-item {
                padding: 25px;
            }
            
            .item-image {
                width: 120px;
                height: 120px;
                font-size: 32px;
            }
            
            .item-name {
                font-size: 20px;
            }
            
            .current-price {
                font-size: 20px;
            }
        }

        /* @media (max-width: 480px) {
            .app-container {
                padding: 0 10px;
            } */
            
            header {
                padding: 15px 0;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .favorite-item {
                padding: 12px;
                gap: 12px;
            }
            
            .item-image {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }
            
            .item-name {
                font-size: 16px;
            }
            
            .current-price, .original-price {
                font-size: 16px;
            }
            
            .price-container {
                gap: 8px;
            }
            
            .nav-item {
                font-size: 10px;
            }
            
            .nav-item i {
                font-size: 20px;
            }
        }  
            body {
                background: #f5f5f7;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Favorites</h1>
        </header>
        
        <div class="favorites-container">
            <div class="favorite-item">   
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("luxuryUser"));
        
        if (!user || !user.email) {
          alert("Please login first");
          location.href = "index.html";
        }
        
        const LIKE_KEY = `likedProducts_${user.email.toLowerCase()}`;
        const likedIds = JSON.parse(localStorage.getItem(LIKE_KEY)) || [];
        
        const container = document.querySelector(".favorites-container");
        
        async function loadFavorites() {
          if (!likedIds.length) {
            container.innerHTML = "<p style='text-align:center'>No favorites yet ❤️</p>";
            return;
          }
        
          try {
            const res = await fetch("https://luxrymoll.vercel.app/api/getProducts");
            const products = await res.json();
        
            const favProducts = products.filter(p =>
              likedIds.includes(p._id)
            );
        
            container.innerHTML = "";
        
            favProducts.forEach(p => {
              const img =
                p.images?.[0]
                  ? p.images[0].startsWith("data:image/")
                    ? p.images[0]
                    : `data:image/jpeg;base64,${p.images[0]}`
                  : "";
        
              const card = document.createElement("div");
              card.className = "favorite-item";
        
              card.innerHTML = `
                <img class="item-image" src="${img}" alt="${p.title}">
                <div class="item-info">
                  <div class="item-name">${p.title}</div>
                  <div class="price-container">
                    <div class="current-price">₹${p.sellingPrice}</div>
                    <div class="original-price">₹${p.originalPrice}</div>
                  </div>
                </div>
                <div class="heart-icon">
                  <i class="fas fa-heart"></i>
                </div>
              `;
        
              /* 💔 UNLIKE */
              card.querySelector(".heart-icon").onclick = (e) => {
                e.stopPropagation();
        
                let updated = JSON.parse(localStorage.getItem(LIKE_KEY)) || [];
                updated = updated.filter(id => id !== p._id);
                localStorage.setItem(LIKE_KEY, JSON.stringify(updated));
        
                card.remove();
        
                if (!updated.length) {
                  container.innerHTML =
                    "<p style='text-align:center'>No favorites yet ❤️</p>";
                }
              };
        
              /* 👉 product page */
              card.onclick = () => {
                location.href = "product.html?id=" + p._id;
              };
        
              container.appendChild(card);
            });
          } catch (err) {
            console.error(err);
            container.innerHTML = "<p>Error loading favorites</p>";
          }
        }
        
        loadFavorites();
        // Add some interactivity
        document.querySelectorAll('.favorite-item').forEach(item => {
            item.addEventListener('click', function() {
                this.style.backgroundColor = '#f8f8f8';
                setTimeout(() => {
                    this.style.backgroundColor = 'white';
                }, 200);
            });
        });
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(nav => {
                    nav.classList.remove('active');
                });
                this.classList.add('active');
            });
        });
        
        // Heart icon toggle functionality
        document.querySelectorAll('.heart-icon').forEach(icon => {
            icon.addEventListener('click', function(e) {
                e.stopPropagation(); // Prevent triggering the item click
                const heart = this.querySelector('i');
                if (heart.classList.contains('fas')) {
                    heart.classList.remove('fas');
                    heart.classList.add('far');
                    this.style.color = '#8e8e93';
                } else {
                    heart.classList.remove('far');
                    heart.classList.add('fas');
                    this.style.color = '#ff3b30';
                }
            });
        });
    </script>
</body>
</html>
