<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
<title>Checkout Product | Luxrymoll</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body{ background:#f5f7f8; color:#1f2937; }
html,body{ height: 100%; width: 100%; }
nav{ padding: 1px 3px; display: flex; align-items: center; justify-content: space-between; background: #ffffff; position: relative; height: 70px; border-bottom: 2px solid #00000014; }
@media (max-width: 768px) {
    nav{ height: 50px;}
}
.left-section { display: flex; align-items: center; gap: 1rem; }
.icon-pic {  width: 25px; height: 25px; position: absolute; left: 20px; }
.icon-pic img { width: 80%; height: 80%;}
.logo img { display: flex; position: relative; left: 25px; margin-top: 18px; width: 22px; height: auto; }
.center-wrapper{ display:none;}
.nav-right{ display:flex; align-items:center; gap:6px; color:#6b7280; font-size:14px; position: absolute; right: 20px; }
.lock-icon{ font-size:14px; display:flex; align-items:center; }
.lock-icon img{ height:14px; width:auto; display:block; }
@media(max-width:768px){
    .navbar{ padding:12px 16px; }
    .logo img { display: none; }
    .secure-text{ display:none; }
}
@media (max-width: 768px) {
    .logo img{ display:none; }
    .center-wrapper{ display:flex; align-items:center; margin:0 auto; }
}
.mobile-layout{ display:block; padding:15px; }
.mobile-card{ display:block; background:#fff; border-radius:16px; border:1px solid #e5e7eb; padding:18px; margin-bottom:18px; }
.place-order-btn{ position:fixed; bottom:0; left:0; width:100%; padding:16px; background:#1f2937; color:#fff; font-weight:600; border:none; }
.summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e5e5e5; }
.summary-title { font-size: 20px; font-weight: 600; color: #1a1a1a; }
.edit-btn { color: #0066cc; text-decoration: none; font-size: 14px; font-weight: 500; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.edit-btn:hover { background-color: #f0f7ff; }
.product-section { border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; margin-bottom: 20px; background-color: #ffffff; }
.product-item { display: flex; gap: 12px; }
.product-image-placeholder { width: 80px; height: 80px; background: linear-gradient(135deg, #e0e0e0 0%, #d0d0d0 100%); border-radius: 8px; flex-shrink: 0; }
.product-image-placeholder img { width: 100%; height: 100%; object-fit: contain; display: block; }
.product-details { flex: 1; }
.product-name { font-weight: 600; color: #1a1a1a; font-size: 16px; margin-bottom: 6px; }
.product-variants { color: #666; font-size: 14px; margin-bottom: 8px; }
.product-price { font-weight: 600; color: #1a1a1a;  font-size: 18px; }
.divider { height: 1px; background-color: #e5e5e5; margin: 20px 0; }
.delivery-section { margin-top: 8px; }
.delivery-title { font-weight: 600; color: #1a1a1a; font-size: 16px; margin-bottom: 16px; }
.delivery-contact-card { border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; background-color: #ffffff; }
.delivery-item { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e5e5e5; }
.delivery-icon { width: 24px; height: 24px; background-color: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #666; font-size: 14px; }
.delivery-content { flex: 1; }
.delivery-label { font-weight: 600; color: #1a1a1a; font-size: 15px; margin-bottom: 4px; }
.delivery-address { color: #666; font-size: 14px; line-height: 1.5; }
.contact-item { display: flex; gap: 12px; align-items: flex-start; }
.contact-icon { width: 24px; height: 24px; background-color: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #666; font-size: 14px; }
.contact-content { flex: 1; }
.contact-label { font-weight: 600; color: #1a1a1a; font-size: 15px; margin-bottom: 4px; }
.contact-email { color: #666; font-size: 14px; }
.delivery-icon::before { content: "📍"; font-size: 14px; }
.contact-icon::before { content: "📧"; font-size: 14px; }
@media (max-width: 400px) {
    .order-summary { padding: 20px; } 
    .product-item { flex-direction: column; } 
    .product-image-placeholder { width: 100%; height: 120px; }
}
.summary-card{ background:#ffffff; border-radius:20px; padding:24px; width: 100%; margin:0 auto 120px auto; box-shadow:0 4px 20px rgba(0,0,0,0.05); }
.coupon-box{ display:flex; gap:12px; }
.coupon-box input{ flex:1; padding:16px; border-radius:14px; border:1px solid #e5e7eb; background:#f1f5f9; font-size:15px; color:#64748b; }
.coupon-box input::placeholder{ color:#94a3b8; }
.apply-btn{ padding:16px 20px; border:none; border-radius:14px; background:#379777; color:#ffffff; font-weight:600; cursor:pointer; }
.apply-btn:hover{ opacity:0.9; }
.divider{ height:1px; background:#e5e7eb; margin:22px 0; }
.price-row{ display:flex; justify-content:space-between; margin-bottom:14px; font-size:16px; color:#64748b; }
.price-row span:last-child{ font-weight:500; color:#111827; }
.discount span{ color:#ef4444; }
.total{ font-size:20px; font-weight:700; color:#111827; }
.place-order-btn{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:90%; padding:18px; border:none; border-radius:20px; background:#4b5563; color:#ffffff; font-size:16px; font-weight:600; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:8px; }
.place-order-btn:hover{ background:#374151; }
.arrow{ font-size:18px; }
</style>
</head>
    <body>
      <nav>
          <div class="left-section">
              <div class="icon-pic" id="backBtn">
                  <img src="https://cdn-icons-png.flaticon.com/512/5343/5343109.png" alt="Back">
              </div>
              <div class="logo">
                  <img src="header.png" alt="Luxrymoll"></div>
              </div>
          </div>
          <div class="center-wrapper">
              <strong>Checkout</strong>
          </div>
          <div class="nav-right">
              <span class="lock-icon"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828415.png" alt="Secure"></span>
              <span class="secure-text">Secure Checkout</span>
          </div>
      </nav>
        <!-- ================= MOBILE VIEW ================= -->
        <div class="mobile-layout">
            <div class="summary-header">
                <h2 class="summary-title">Order Summary</h2>
                <button class="edit-btn" id="editbtn">Edit</button>
            </div>
            <div class="product-section">
                <div class="product-item">
                    <div class="product-image-placeholder"><img id="productImage" alt="Product Image"></div>
                    <div class="product-details">
                        <div class="product-name"><span id="section-title"></span></div>
                        <div class="product-variants">Color: Neutral Sand · Qty: <span id="quantity"></span></div>
                        <div class="product-price"><span id="itemsTotal0"></span></div>
                    </div>
                </div>
            </div>
            <div class="divider"></div>
            <div class="delivery-section">
                <h3 class="delivery-title">Delivery</h3>
                <div class="delivery-contact-card">
                    <div class="delivery-item">
                        <div class="delivery-icon" aria-label="Location"></div>
                        <div class="delivery-content">
                            <div class="delivery-label">Aanya Patel</div>
                            <div class="delivery-address">
                                123 Meadow Lane, Apt 4B<br>
                                San Francisco, CA 94107
                            </div>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon" aria-label="Email"></div>
                        <div class="contact-content">
                            <div class="contact-label">Contact</div>
                            <div class="contact-email" id="email">Fetching...</div>
                        </div>
                    </div>
                </div>
            </div>
          <div class="mobile-card">
            <strong>Credit Card</strong>
            <input placeholder="Card number">
            <div style="display:flex;gap:10px;">
              <input placeholder="MM/YY">
              <input placeholder="CVC">
            </div>
            <input placeholder="Name on card">
          </div>
          <div class="summary-card">
              <div class="coupon-box">
                <input type="text" placeholder="Gift card or discount code">
                <button class="apply-btn">Apply</button>
              </div>
              <div class="divider"></div>
              <div class="price-row">
                <span>Subtotal</span>
                <span id="itemsTotal"></span>
              </div>
            
              <div class="price-row discount">
                <span>Discount (SAVE25)</span>
                <span>-00</span>
              </div>
            
              <div class="price-row">
                <span>Shipping</span>
                <span>50</span>
              </div>
            
              <div class="price-row">
                <span>Estimated Taxes</span>
                <span>0</span>
              </div>
              <div class="divider"></div>
              <div class="price-row total">
                <span>Total</span>
                <span id="finalTotal"></span>
              </div>
            </div>
            <button class="place-order-btn">
              Place Order • $970.92
              <span class="arrow">→</span>
            </button>
          </div>
        </div>
        <script src="checkout.js"></script>
        <script>
        document.getElementById("backBtn").addEventListener("click", function() {
            window.history.back();
        });
        </script>
    </body>
</html>
