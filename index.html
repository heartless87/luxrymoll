<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://kit.fontawesome.com">
    <meta name="author" content="Luxrymoll">
    <link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
    <title>Luxrymoll – Buy Premium Luxury Products Online in India</title>
    <meta name="keywords" content="luxury products, online shopping India, premium fashion, branded watches, shoes, smartphones">
    <meta property="og:image" content="https://luxrymoll.shop/preview.jpg">
    <meta property="og:locale" content="en_IN">
    <link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
    <meta name="description" content="Luxrymoll.shop – luxury products ka trusted online mall. Premium quality, best deals aur fast delivery. Luxrymoll par karein smart shopping.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://luxrymoll.shop/">
    <meta property="og:title" content="Luxrymoll | Premium Luxury Mall Online">
    <meta property="og:description" content="Shop premium fashion, accessories & lifestyle products online at Luxrymoll.shop with fast delivery across India.">
    <meta property="og:url" content="https://luxrymoll.shop/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Luxrymoll">
    <link rel="stylesheet" href="style.css">
    <meta name="google-adsense-account" content="ca-pub-7717875002370610">
    <script async 
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7717875002370610"
    crossorigin="anonymous"></script>
    <script type="application/ld+json">
    {
     "@context": "https://schema.org",
     "@type": "WebSite",
     "name": "Luxrymoll",
     "url": "https://luxrymoll.shop/",
     "potentialAction": {
       "@type": "SearchAction",
       "target": "https://luxrymoll.shop/search.html?q={search_term_string}",
       "query-input": "required name=search_term_string"
     }
    }
    </script>
</head>
<body>   
    <nav>
        <div class="left-section">
            <div class="hamburger-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo">
                <h1>Luxrymoll</h1>
            </div>
        </div>
        <div class="search-container">
            <span class="search-icon"><i class="fas fa-search"></i></span>
            <input type="text" class="search-box" placeholder="Search for products, collections and more...">
        </div>
        <ul id="menuList">
            <li><a href="favourites">
            <div class="icon-pic">
              <img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png" alt="Like"></div>
            </a></li>
            <li><a href="profile.html">
            <div class="profile-pic" id="profilePic">
              <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/3177/3177440.png" alt="Profile Photo"></div>
            </a></li>
            <li id="loginBtn"><a href="profile.html#login">Login</a></li>
            <li id="signupBtn"><a href="profile.html#register">Signup</a></li>
        </ul>
        <header class="header-wrap">
        <div class="search-bar">  
            <form action="search.html" method="GET" style="display:flex;flex:1;gap:10px;">
                <input 
                    type="text" 
                    name="q" 
                    placeholder="Search products..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                />
                <button type="submit" style="background:none;border:none;">
                    <i class="fas fa-search"></i>
                </button>
            </form>            
        </div>
    </header>  
    <section class="banner">
        <ins class="adsbygoogle"
            style="display:block; text-align:center;"
            data-ad-client="ca-pub-7717875002370610"
            data-ad-slot="9411978827">
            data-ad-format="auto"
            data-full-width-responsive="true">
        </ins>
    </section>
    <script>
        window.addEventListener("load", () => {
          (adsbygoogle = window.adsbygoogle || []).push({});
        });
    </script>
    <section class="categories">
        <div class="category-item" onclick="location.href='catg-dress.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="/PNG/Shirt.png" alt="Shirt" loading="lazy">
            </div>
            <p>Shirt</p>
        </div>

        <div class="category-item" onclick="location.href='catg-watch.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/10169/10169344.png" alt="Watch">
            </div>
            <p>Watch</p>
        </div>

        <div class="category-item" onclick="location.href='catg-shoes.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2742/2742674.png" alt="Shoes">
            </div>
            <p>Shoes</p>
        </div>

        <div class="category-item" onclick="location.href='catg-smartphone.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/644/644458.png" alt="Smartphones">
            </div>
            <p>SmartPhones</p>
        </div>
    </section>

    <section>
        <div class="section-title">
            <h3>Popular Items</h3>
        </div>

        <div class="products-grid" id="products-container"></div>
        <div id="loading">
            <svg viewBox="25 25 50 50" class="loadingan">
              <circle cx="50" cy="50" r="20" class="loader"></circle>
            </svg>
        </div>
    </section>
    
    <script src="script.js"></script>
    <script>
      (function () {
        try {
          const user = JSON.parse(localStorage.getItem("luxuryUser"));
          const loginBtn = document.getElementById("loginBtn");
          const signupBtn = document.getElementById("signupBtn");
    
          if (user && user.email) {
            if (loginBtn) loginBtn.style.display = "none";
            if (signupBtn) signupBtn.style.display = "none";
          } else {
            if (loginBtn) loginBtn.style.display = "block";
            if (signupBtn) signupBtn.style.display = "block";
          }
        } catch (e) {
          console.error("Login check error:", e);
        }
      })();
    </script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
      const profileImage = document.getElementById("profileImage");
      if (!profileImage) return;
      const savedImage = localStorage.getItem("Profile-pic");
      if (savedImage) {
        profileImage.src = savedImage;
      }
    });
    </script>
</body>
</html>
