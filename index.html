<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luxrymoll.shop - Best Online shoping website</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7717875002370610"
         crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="search-bar">  
            <form action="search.html" method="GET" style="display:flex;flex:1;gap:10px;">
                <input 
                    type="text" 
                    name="q" 
                    placeholder="Search products..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                />
                <button type="submit" style="background:none;border:none;">
                    <i class="fas fa-search"></i>
                </button>
            </form>
            
            <div class="header-icons">
                <a href="cart.html">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="profile.html">
                    <i class="fas fa-user"></i>
                </a>
            </div>
    
        </div>
    </header>
    
    <section class="banner">
        <ins class="adsbygoogle"
            style="display:block; text-align:center;"
            data-ad-layout="in-article"
            data-ad-format="fluid"
            data-ad-client="ca-pub-7717875002370610"
            data-ad-slot="9411978827"></ins>
    </section>

    <section class="categories">
        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/7417/7417708.png" alt="Dresses">
            </div>
            <p>Dresses</p>
        </div>

        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/10169/10169344.png" alt="Watch">
            </div>
            <p>Watch</p>
        </div>

        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2742/2742674.png" alt="Shoes">
            </div>
            <p>Shoes</p>
        </div>

        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/644/644458.png" alt="Smartphones">
            </div>
            <p>SmartPhones</p>
        </div>
    </section>

    <section>
        <div class="section-title">
            <h3>Popular Items</h3>
        </div>

        <div class="products-grid" id="products-container"></div>
        <div id="loading">Loading more products...</div>
    </section>

    <script src="script.js"></script>

</body>
</html>
