<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxrymoll | Premium Luxury Mall Online – Luxrymoll.shop</title>
    <meta name="description" content="Luxrymoll.shop – India ka trusted luxury shopping mall. Original premium products, best prices, fast delivery & secure payment. Aaj hi Luxrymoll se shopping karein.">
    <meta name="Luxrymoll.shop official luxury mall website. Buy premium fashion, accessories & lifestyle products online with fast delivery & genuine quality.">
    <meta name="Luxrymoll.shop – luxury products ka trusted online mall. Premium quality, best deals aur fast delivery. Luxrymoll par karein smart shopping.">
    <meta name="Luxrymoll.shop – Premium luxury mall online. Original products, best prices & fast delivery across India.">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7717875002370610"
         crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="search-bar">  
            <form action="search.html" method="GET" style="display:flex;flex:1;gap:10px;">
                <input 
                    type="text" 
                    name="q" 
                    placeholder="Search products..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                />
                <button type="submit" style="background:none;border:none;">
                    <i class="fas fa-search"></i>
                </button>
            </form>
            
            <div class="header-icons">
                <a href="cart.html">
                    <i class="fas fa-shopping-cart"></i>
                </a>
            </div>
            <label class="bar" for="check">
                <input type="checkbox" id="check">                
                <span class="top"></span>
                <span class="middle"></span>
                <span class="bottom"></span>
            </label>
        </div>
    </header>  
    <section class="banner">
        <ins class="adsbygoogle"
            style="display:block; text-align:center;"
            data-ad-layout="in-article"
            data-ad-format="fluid"
            data-ad-client="ca-pub-7717875002370610"
            data-ad-slot="9411978827"></ins>
    </section>

    <section class="categories">
        <div class="category-item" onclick="location.href='catg-dress.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/7417/7417708.png" alt="Dresses">
            </div>
            <p>Dresses</p>
        </div>

        <div class="category-item" onclick="location.href='catg-watch.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/10169/10169344.png" alt="Watch">
            </div>
            <p>Watch</p>
        </div>

        <div class="category-item" onclick="location.href='catg-shoes.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2742/2742674.png" alt="Shoes">
            </div>
            <p>Shoes</p>
        </div>

        <div class="category-item" onclick="location.href='catg-smartphone.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/644/644458.png" alt="Smartphones">
            </div>
            <p>SmartPhones</p>
        </div>
    </section>

    <section>
        <div class="section-title">
            <h3>Popular Items</h3>
        </div>

        <div class="products-grid" id="products-container"></div>
        <div id="loading">Loading more products...</div>
    </section>

    <script src="script.js"></script>

</body>
</html>
