<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luxrymoll.shop - Best Online shoping website</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7717875002370610"
         crossorigin="anonymous"></script>
</head>

<body>

    <!-- Header Section -->
    <header>
        <div class="search-bar">
            <input type="text" placeholder="Search products...">
            <img scr="https://cdn-icons-png.flaticon.com/512/15159/15159482.png"
            <!-- <i class="fas fa-bell"></i> -->
        </div>
    </header>

    <!-- Banner Ad -->
    <section class="banner">
        <ins class="adsbygoogle"
            style="display:block; text-align:center;"
            data-ad-layout="in-article"
            data-ad-format="fluid"
            data-ad-client="ca-pub-7717875002370610"
            data-ad-slot="9411978827"></ins>
    </section>

    <!-- Categories Section -->
    <section class="categories">
        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/7417/7417708.png" alt="Dresses">
            </div>
            <p>Dresses</p>
        </div>

        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/10169/10169344.png" alt="Watch">
            </div>
            <p>Watch</p>
        </div>

        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2742/2742674.png" alt="Shoes">
            </div>
            <p>Shoes</p>
        </div>

        <div class="category-item">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/644/644458.png" alt="Smartphones">
            </div>
            <p>SmartPhones</p>
        </div>

        <!-- <div class="see-more">See more →</div> -->
    </section>

    <!-- Popular Items Section -->
    <section>
        <div class="section-title">
            <h3>Popular Items</h3>
        </div>

        <div class="products-grid" id="products-container"></div>
        <div id="loading">Loading more products...</div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>

        <a href="favourites.html" class="nav-item">
            <i class="fas fa-heart"></i>
            <span>Favorites</span>
        </a>

        <a href="cart.html" class="nav-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
        </a>

            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>

    <!-- Scripts -->
    <script src="script.js"></script>
