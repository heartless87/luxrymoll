<!DOCTYPE html>

<head>

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://luxrymoll.shop/">
    <meta property="og:title" content="Luxrymoll | Premium Luxury Mall Online">
    <meta property="og:description" content="Shop premium fashion, accessories & lifestyle products online at Luxrymoll.shop with fast delivery across India.">
    <meta property="og:url" content="https://luxrymoll.shop/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Luxrymoll">

</head>
<body>   
    <nav>
        <div class="logo">
            <h1>Luxrymoll</h1>
        </div>
        <ul id="menuList">
            <li><a href="profile.html">Profile</a></li>
            <li><a href="favourites.html">Favorite</a></li>
            <li id="loginBtn"><a href="profile.html#login">Login</a></li>
            <li id="signupBtn"><a href="profile.html#register">Signup</a></li>
        </ul>
        <div class="menu-icon">
            <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
    </nav>
    <script>
        let menuList = document.getElementById("menuList")
        menuList.style.maxHeight = "0px";
        function toggleMenu(){
            if(menuList.style.maxHeight == "0px")
            {
                menuList.style.maxHeight = "300px";
            }
            else{
                menuList.style.maxHeight = "0px";
            }
        } 
    </script>
    <script src="https://kit.fontawesome.com/aa2ad09b73.js" crossorigin="anonymous"></script>
        <header class="header-wrap">
        <div class="search-bar">  
            <form action="search.html" method="GET" style="display:flex;flex:1;gap:10px;">
                <input 
                    type="text" 
                    name="q" 
                    placeholder="Search products..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                />
                <button type="submit" style="background:none;border:none;">
                    <i class="fas fa-search"></i>
                </button>
            </form>            
        </div>
    </header>  
    <section class="banner">
        <ins class="adsbygoogle"
            style="display:block; text-align:center;"
            data-ad-client="ca-pub-7717875002370610"
            data-ad-slot="9411978827">
            data-ad-format="auto"
            data-full-width-responsive="true"</ins>
    </section>
    <script>
        window.addEventListener("load", () => {
          (adsbygoogle = window.adsbygoogle || []).push({});
        });
    </script>
    <section class="categories">
        <div class="category-item" onclick="location.href='catg-dress.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="/PNG/Shirt.png" alt="Shirt">
            </div>
            <p>Shirt</p>
        </div>

        <div class="category-item" onclick="location.href='catg-watch.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/10169/10169344.png" alt="Watch">
            </div>
            <p>Watch</p>
        </div>

        <div class="category-item" onclick="location.href='catg-shoes.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2742/2742674.png" alt="Shoes">
            </div>
            <p>Shoes</p>
        </div>

        <div class="category-item" onclick="location.href='catg-smartphone.html'" style="cursor:pointer;">
            <div class="cat-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/644/644458.png" alt="Smartphones">
            </div>
            <p>SmartPhones</p>
        </div>
    </section>

    <section>
        <div class="section-title">
            <h3>Popular Items</h3>
        </div>

        <div class="products-grid" id="products-container"></div>
        <div id="loading">
            <svg viewBox="25 25 50 50" class="loadingan">
              <circle cx="50" cy="50" r="20" class="loader"></circle>
            </svg>
        </div>
    </section>
    
    <script src="script.js"></script>
    <script>
      (function () {
        try {
          const user = JSON.parse(localStorage.getItem("luxuryUser"));
    
          const loginBtn = document.getElementById("loginBtn");
          const signupBtn = document.getElementById("signupBtn");
    
          if (user && user.email) {
            if (loginBtn) loginBtn.style.display = "none";
            if (signupBtn) signupBtn.style.display = "none";
          } else {
            if (loginBtn) loginBtn.style.display = "block";
            if (signupBtn) signupBtn.style.display = "block";
          }
        } catch (e) {
          console.error("Login check error:", e);
        }
      })();
    </script>
</body>
</html>
