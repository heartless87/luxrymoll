<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNow - Best Deals</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Top Bar
    <div class="top-bar">
        <div class="time">9:41</div>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>   -->

    <!-- Header -->
    <header>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
            <i class="fas fa-bell"></i>
        </div>

        <!-- Banner -->
        <div class="banner">
            <div class="banner-content">
                <h2>Get your special sale up to 40%</h2>
                <button class="shop-now">Shop Now</button>
            </div>
            <img src="https://via.placeholder.com/300x200/007bff/ffffff?text=iPhone" alt="Banner">
        </div>

        <!-- Categories -->
        <div class="categories">
            <div class="category-item">
                <div class="cat-icon"><img src="https://via.placeholder.com/50/333/fff?text=Dress" alt=""></div>
                <p>Dresses</p>
            </div>
            <div class="category-item">
                <div class="cat-icon"><img src="https://via.placeholder.com/50/333/fff?text=Watch" alt=""></div>
                <p>Watch</p>
            </div>
            <div class="category-item">
                <div class="cat-icon"><img src="https://via.placeholder.com/50/333/fff?text=Shoes" alt=""></div>
                <p>Shoes</p>
            </div>
            <div class="category-item">
                <div class="cat-icon"><img src="https://via.placeholder.com/50/333/fff?text=Cap" alt=""></div>
                <p>Cap</p>
            </div>
            <div class="see-more">See more →</div>
        </div>

        <!-- Popular Items -->
        <div class="section-title">
            <h3>Popular Items</h3>
        </div>

        <div class="products-grid" id="products-container">
            <!-- Products loaded by JS -->
        </div>

        <div id="loading">Loading more products...</div>
    </header>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-heart"></i>
            <span>Favorites</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </div>
    </nav>

    <script src="/static/js/script.js"></script>
</body>
</html>
