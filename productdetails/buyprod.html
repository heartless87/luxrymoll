<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .checkout-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .checkout-header {
            background-color: white;
            padding: 24px 20px 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .checkout-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 20px;
        }
        
        .section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        
        .delivery-method {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .method-name {
            font-weight: 400;
            font-size: 16px;
        }
        
        .method-price {
            font-weight: 400;
            font-size: 16px;
            color: #1d1d1f;
        }
        
        .address {
            font-size: 16px;
            line-height: 1.4;
            color: #1d1d1f;
            font-weight: 400;
        }
        
        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px 0;
        }
        
        .payment-section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .payment-method-title {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
        }
        
        .payment-option {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 0;
        }
        
        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #86868b;
            border-radius: 3px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .checkbox.checked {
            background-color: #007aff;
            border-color: #007aff;
        }
        
        .checkbox.checked::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .payment-label {
            font-size: 16px;
            font-weight: 400;
            color: #1d1d1f;
            cursor: pointer;
        }
        
        .sub-section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .sub-title {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
        }
        
        .payment-visa {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 0;
        }
        
        .visa-label {
            font-size: 16px;
            font-weight: 400;
            color: #1d1d1f;
        }
        
        .items-section {
            padding: 20px;
        }
        
        .items-title {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
        }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 16px;
        }
        
        .item-label {
            color: #1d1d1f;
            font-weight: 600;
        }
        
        .item-value {
            font-weight: 400;
            color: #1d1d1f;
        }
        
        .total-price {
            font-weight: 600;
            font-size: 16px;
            color: #1d1d1f;
        }
        
        .confirm-btn {
            background-color: #007aff;
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        
        .confirm-btn:hover {
            background-color: #0056cc;
        }
        
        .price {
            color: #1d1d1f;
        }
        
        .dashed-divider {
            height: 1px;
            background: linear-gradient(to right, transparent 50%, #e0e0e0 50%);
            background-size: 10px 1px;
            margin: 20px 0;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .checkout-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Checkout</h1>
            
            <div class="section">
                <div class="section-title">Delivery method</div>
                <div class="delivery-method">
                    <div class="method-name">Standard Delivery</div>
                    <div class="method-price"><span class="price">+$2.65</span></div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">Address</div>
                <div class="address">
                    NY, United States<br>
                    300 Post Street 122422
                </div>
            </div>
        </div>
        
        <div class="dashed-divider"></div>
        
        <div class="payment-section">
            <div class="payment-method-title">Payment method</div>
            
            <div class="payment-option" id="paypal-option">
                <div class="checkbox" id="paypal-checkbox"></div>
                <div class="payment-label">Paypal</div>
            </div>
            
            <div class="payment-option" id="mastercard-option">
                <div class="checkbox checked" id="mastercard-checkbox"></div>
                <div class="payment-label">Master Card</div>
            </div>
        </div>
        
        <div class="sub-section">
            <div class="sub-title">VISA</div>
            
            <div class="payment-visa">
                <div class="visa-label">Visa Card</div>
            </div>
        </div>
        
        <div class="dashed-divider"></div>
        
        <div class="items-section">
            <div class="items-title">Items (3)</div>
            
            <div class="item-row">
                <div class="item-label">Delivery Fee:</div>
                <div class="item-value"><span class="price">$27.18</span></div>
            </div>
            
            <div class="item-row">
                <div class="item-label">Total Price:</div>
                <div class="item-value total-price"><span class="price">$29.18</span></div>
            </div>
            
            <button class="confirm-btn" id="confirmBtn">Confirm</button>
        </div>
    </div>

    <script>
        // Handle payment method selection
        const paypalOption = document.getElementById('paypal-option');
        const mastercardOption = document.getElementById('mastercard-option');
        const paypalCheckbox = document.getElementById('paypal-checkbox');
        const mastercardCheckbox = document.getElementById('mastercard-checkbox');
        
        paypalOption.addEventListener('click', function() {
            paypalCheckbox.classList.add('checked');
            mastercardCheckbox.classList.remove('checked');
        });
        
        mastercardOption.addEventListener('click', function() {
            mastercardCheckbox.classList.add('checked');
            paypalCheckbox.classList.remove('checked');
        });
        
        // Handle confirm button click
        document.getElementById('confirmBtn').addEventListener('click', function() {
            const selectedPayment = document.querySelector('.checkbox.checked').parentElement.querySelector('.payment-label').textContent;
            
            // Show a confirmation message
            alert(`Order confirmed! Payment will be processed via ${selectedPayment}.`);
            
            // Button feedback
            this.textContent = 'Processing...';
            this.style.backgroundColor = '#0056cc';
            
            // Reset button after 2 seconds
            setTimeout(() => {
                this.textContent = 'Confirm';
                this.style.backgroundColor = '#007aff';
            }, 2000);
        });
        
        // Add hover effects for payment options
        const paymentOptions = document.querySelectorAll('.payment-option');
        paymentOptions.forEach(option => {
            option.addEventListener('mouseenter', function() {
                this.style.backgroundColor = '#f9f9f9';
                this.style.cursor = 'pointer';
            });
            
            option.addEventListener('mouseleave', function() {
                this.style.backgroundColor = 'transparent';
            });
        });
        
        // Add hover effects for visa card option
        const visaOption = document.querySelector('.payment-visa');
        visaOption.addEventListener('mouseenter', function() {
            this.style.backgroundColor = '#f9f9f9';
            this.style.cursor = 'pointer';
        });
        
        visaOption.addEventListener('mouseleave', function() {
            this.style.backgroundColor = 'transparent';
        });
    </script>
</body>
</html>
