<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
    <title>Product Details | Luxrymoll</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #f7f7f7; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        @media (min-width: 768px) { .container { max-width: 700px; } }
        @media (min-width: 1024px) { .container { max-width: 900px; } }
        @media (min-width: 1400px) { .container { max-width: 1100px; } }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .top-bar i { font-size: 20px; cursor: pointer; }
        .right-icons i { margin-left: 12px; }
        .image-slider img { width: 100%; border-radius: 15px; margin-top: 10px; transition: opacity 0.3s ease; }
        .image-slider img { width: 100%; border-radius: 15px; margin-top: 10px; }
        .image-slider { position: relative; }
        .image-slider button { background: rgba(0,0,0,0.5); color: white; border: none; font-size: 22px; padding: 6px 10px; border-radius: 50%; cursor: pointer; }
        .thumbnail-container { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; padding-bottom: 5px; }
        .thumbnail-box { width: 70px; height: 70px; flex: 0 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; cursor: pointer; background: #fff; display: flex; align-items: center; justify-content: center; }
        .thumbnail-box img { width: 100%; height: 100%; object-fit: contain; }
        .thumbnail-box.active { border: 2px solid #000; }
        .product-info { background: white; border-radius: 15px; margin-top: 15px; padding: 15px; }
        .tag { padding: 4px 8px; font-size: 12px; border-radius: 5px; margin-right: 5px; }
        .popular { background: orange; color: white; }
        .discount { background: gold; color: black; }
        .price-new { font-size: 22px; font-weight: bold; }
        .price-old { text-decoration: line-through; color: gray; margin-left: 10px; }
        .qty-box { display: flex; gap: 10px; margin: 15px 0; }
        .qty-box button { padding: 6px 12px; border-radius: 8px; border: none; background: #ddd; cursor: pointer; }
        .colors, .sizes { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .colors div, .sizes div { background: #eee; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); }
        .buy-btn { width: 100%; padding: 15px; background: gold; border-radius: 10px; font-size: 18px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <i class="fas fa-arrow-left" onclick="history.back()"></i>
        <h3>Product Details</h3>
        <div class="right-icons">
            <i class="fas fa-share" id="shareBtn"></i>
            <i class="fas fa-heart"></i>
        </div>
    </div>
    <div class="image-slider" id="slider">
        <img id="mainImg" src="/placeholder.png" alt="product">
        <button id="prevBtn" style="position:absolute;left:10px;top:50%">❮</button>
        <button id="nextBtn" style="position:absolute;right:10px;top:50%">❯</button>
    </div>
    <div class="thumbnail-container" id="thumbContainer"></div>
    <div class="product-info">        
        <span class="tag popular">Popular</span>
        <span class="tag discount">25% Save</span>
        <h2 id="title">Loading...</h2>
        <div class="price-box">
            <span class="price-new" id="selling"></span>
            <span class="price-old" id="original"></span>
        </div>
        <div class="qty-box">
            <button onclick="decQty()">-</button>
            <span id="qty">1</span>
            <button onclick="incQty()">+</button>
        </div>
        <h4>Description</h4>
        <p id="desc"></p>
    </div>
</div>
<div class="bottom-bar">
    <button class="buy-btn" id="buyNowBtn">Buy Now</button>
</div>
<script>
const BACKEND_URL = "https://luxrymoll.vercel.app";
const PLACEHOLDER = "/placeholder.png";
let images = [];
let index = 0;
let BASE_PRICE = 0;
function convertImg(str) {
  if (!str) return PLACEHOLDER;
  const s = String(str).trim();
  if (/^data:image\/[a-z0-9.+-]+;base64,/i.test(s)) return s;
  if (s.startsWith("/9j/")) return `data:image/jpeg;base64,${s}`;
  if (s.startsWith("iVBOR")) return `data:image/png;base64,${s}`;
  return `data:image/jpeg;base64,${s}`;
}
function updatePrice() {
  const qty = Number(document.getElementById("qty").innerText);
  document.getElementById("selling").innerText = "₹" + (BASE_PRICE * qty);
}
function incQty() {
  const q = document.getElementById("qty");
  let val = Number(q.innerText);

  if (val >= 5) return alert("Maximum quantity is 5");

  q.innerText = val + 1;
  updatePrice();
}
function decQty() {
  const q = document.getElementById("qty");
  let val = Number(q.innerText);

  if (val <= 1) return;

  q.innerText = val - 1;
  updatePrice();
}
const imgEl = document.getElementById("mainImg");
const counterEl = document.getElementById("imgCounter");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const slider = document.getElementById("slider");
function renderImage() {
  imgEl.style.opacity = "0";
  setTimeout(() => {
    imgEl.src = images[index];
    imgEl.style.opacity = "1";
    counterEl.innerText = `${index + 1} / ${images.length}`;
    renderThumbnails();
  }, 120);
}
function renderThumbnails() {
  const container = document.getElementById("thumbContainer");
  if (!container) {
    console.log("Thumbnail container not found");
    return;
  }
  container.innerHTML = "";
  if (!images || images.length === 0) return;
  images.forEach((imgSrc, i) => {
    const box = document.createElement("div");
    box.className = "thumbnail-box";
    if (i === index) box.classList.add("active");
    const img = document.createElement("img");
    img.src = imgSrc;
    box.appendChild(img);
    box.addEventListener("click", () => {
      index = i;
      renderImage();
    });
    container.appendChild(box);
  });
}
async function loadProduct() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return alert("Product ID missing");
  const res = await fetch(`${BACKEND_URL}/api/getProduct?id=${id}`);
  if (!res.ok) return alert("Failed to load product");
  const p = await res.json();
  document.getElementById("title").innerText = p.title;
  document.getElementById("selling").innerText = "₹" + p.sellingPrice;
  document.getElementById("original").innerText = "₹" + p.originalPrice;
  document.getElementById("desc").innerText =
    p.description || "No description available";
  BASE_PRICE = Number(p.sellingPrice);
  document.getElementById("selling").innerText = "₹" + BASE_PRICE;  
  images = (p.images || []).map(convertImg);
  if (!images.length) images = [PLACEHOLDER];
  index = 0;
  renderImage();
}
if (nextBtn && prevBtn) {
  nextBtn.onclick = () => {
    index = (index + 1) % images.length;
    renderImage();
  };
  prevBtn.onclick = () => {
    index = (index - 1 + images.length) % images.length;
    renderImage();
  };
}
let startX = 0;
slider.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});
slider.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].clientX - startX;
  if (diff > 50) {
    index = (index - 1 + images.length) % images.length;
    renderImage();
  }
  if (diff < -50) {
    index = (index + 1) % images.length;
    renderImage();
  }
});
if (window.innerWidth < 768) {
  if (nextBtn) nextBtn.style.display = "none";
  if (prevBtn) prevBtn.style.display = "none";
}
(function preloadImage() {
  const preview = sessionStorage.getItem("previewProduct");
  if (!preview) return;

  try {
    const data = JSON.parse(preview);
    const currentId = new URLSearchParams(location.search).get("id");

    if (data.id === currentId && data.image) {
      document.getElementById("mainImg").src = data.image;
    }
  } catch (err) {
    console.log("Preview load failed");
  }
})();
loadProduct();
</script>
<script>
document.getElementById("buyNowBtn").addEventListener("click", () => {

  const product = {
    id: new URLSearchParams(window.location.search).get("id"),
    title: document.getElementById("title").innerText,
    price: Number(document.getElementById("selling").innerText.replace("₹","")),
    originalPrice: Number(document.getElementById("original").innerText.replace("₹","")),
    qty: Number(document.getElementById("qty").innerText),
    desc: document.getElementById("desc").innerText,
    image: document.getElementById("mainImg").src
  };

  localStorage.setItem("checkoutProduct", JSON.stringify(product));

  window.location.href = "checkout.html";
});
</script>
<script>
const shareBtn = document.getElementById("shareBtn");
if (shareBtn) {
  shareBtn.addEventListener("click", async () => {
    const shareUrl = window.location.href;
    const title = document.getElementById("title")?.innerText || "Product";
    if (navigator.share) {
      try {
        await navigator.share({
          title: title,
          url: shareUrl
        });
      } catch (err) {
      }
    } else {
      navigator.clipboard.writeText(shareUrl);
      alert("Link copied to clipboard");
    }
  });
}
</script>
</body>
</html>
