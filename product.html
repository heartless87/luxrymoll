<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f7f7f7;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        @media (min-width: 768px) { .container { max-width: 700px; } }
        @media (min-width: 1024px) { .container { max-width: 900px; } }
        @media (min-width: 1400px) { .container { max-width: 1100px; } }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar i {
            font-size: 20px;
            cursor: pointer;
        }

        .right-icons i { margin-left: 12px; }

        .image-slider img {
            width: 100%;
            border-radius: 15px;
            margin-top: 10px;
        }

        .product-info {
            background: white;
            border-radius: 15px;
            margin-top: 15px;
            padding: 15px;
        }

        .tag {
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .popular { background: orange; color: white; }
        .discount { background: gold; color: black; }

        .price-new {
            font-size: 22px;
            font-weight: bold;
        }

        .price-old {
            text-decoration: line-through;
            color: gray;
            margin-left: 10px;
        }

        .qty-box {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .qty-box button {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            background: #ddd;
            cursor: pointer;
        }

        .colors, .sizes {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .colors div, .sizes div {
            background: #eee;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px;
            box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background: gold;
            border-radius: 10px;
            font-size: 18px;
            border: none;
            cursor: pointer;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="top-bar">
        <i class="fas fa-arrow-left" onclick="history.back()"></i>
        <h3>Item Details</h3>
        <div class="right-icons">
            <i class="fas fa-share"></i>
            <i class="fas fa-heart"></i>
        </div>
    </div>

    <div class="image-slider">
        <img id="mainImg" src="" alt="product">
    </div>

    <div class="product-info">
        
        <span class="tag popular">Popular</span>
        <span class="tag discount">25% Save</span>

        <h2 id="title">Loading...</h2>

        <div class="price-box">
            <span class="price-new" id="selling"></span>
            <span class="price-old" id="original"></span>
        </div>

        <div class="qty-box">
            <button onclick="decQty()">-</button>
            <span id="qty">1</span>
            <button onclick="incQty()">+</button>
        </div>

        <h4>Description</h4>
        <p id="desc"></p>
    </div>

</div>

<div class="bottom-bar">
    <button class="buy-btn">Buy Now</button>
</div>

<script>
    const BACKEND_URL = "https://luxrymoll.vercel.app";
    const PLACEHOLDER = "/placeholder.png";

    function convertImg(str) {
        if (!str) return PLACEHOLDER;

        const s = String(str).trim();
        if (/^data:image\/[a-z0-9.+-]+;base64,/i.test(s)) return s;
        if (s.startsWith("/9j/")) return `data:image/jpeg;base64,${s}`;
        if (s.startsWith("iVBOR")) return `data:image/png;base64,${s}`;
        return `data:image/jpeg;base64,${s}`;
    }

    function decQty() {
        let q = parseInt(document.getElementById("qty").innerText);
        if (q > 1) document.getElementById("qty").innerText = q - 1;
    }

    function incQty() {
        let q = parseInt(document.getElementById("qty").innerText);
        document.getElementById("qty").innerText = q + 1;
    }

    async function loadProduct() {
        const id = new URLSearchParams(window.location.search).get("id");
        if (!id) return alert("Product ID missing!");

        // ⭐ Correct Vercel-compatible URL (MAIN FIX)
        const res = await fetch(`${BACKEND_URL}/api/getProduct?id=${id}`);

        if (!res.ok) {
            console.error("API Error:", res.status);
            alert("Failed to load product!");
            return;
        }

        const p = await res.json();

        document.getElementById("title").innerText = p.title;
        document.getElementById("selling").innerText = "₹" + p.sellingPrice;
        document.getElementById("original").innerText = "₹" + p.originalPrice;
        document.getElementById("desc").innerText = p.description || "No description.";

        const imgData = p.images?.[0];
        document.getElementById("mainImg").src = imgData ? convertImg(imgData) : PLACEHOLDER;

        if (p.colors) {
            p.colors.forEach(c => {
                const div = document.createElement("div");
                div.innerText = c;
                document.getElementById("colors").appendChild(div);
            });
        }

        if (p.sizes) {
            p.sizes.forEach(s => {
                const div = document.createElement("div");
                div.innerText = s;
                document.getElementById("sizes").appendChild(div);
            });
        }
    }

    loadProduct();
</script>

</body>
</html>
