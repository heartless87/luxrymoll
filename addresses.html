<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address | Luxrymoll </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f8f8; color: #333; line-height: 1.6; padding-bottom: 70px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header { background-color: #fff; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08); position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; }
        .logo { font-size: 28px; font-weight: 700; color: #ff7b00; letter-spacing: 1px; }
        .main-content { margin: 40px 0; } 
        .content { background-color: #fff; border-radius: 10px; padding: 30px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05); max-width: 1000px; margin: 0 auto; }
        .page-title { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .page-title h1 { font-size: 28px; color: #333; font-weight: 600; }
        .btn { background-color: #ff7b00; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: 500; transition: background-color 0.3s; font-size: 16px; }
        .btn:hover { background-color: #e66a00; }
        .address-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 25px; }
        .address-card {
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 25px;
            position: relative;
            transition: all 0.3s ease;
            background-color: #fff;
        }
        
        .address-card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transform: translateY(-5px);
        }
        
        .address-card.default {
            border-color: #ff7b00;
            background-color: #fff8f0;
        }
        
        .address-type {
            display: inline-block;
            background-color: #f1f1f1;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
            color: #666;
        }
        
        .address-card.default .address-type {
            background-color: #ff7b00;
            color: white;
        }
        
        .address-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .address-card p {
            margin-bottom: 8px;
            color: #666;
        }
        
        .address-actions {
            display: flex;
            margin-top: 20px;
            gap: 15px;
        }
        
        .address-actions button {
            background: none;
            border: none;
            color: #ff7b00;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .address-actions button:hover {
            color: #e66a00;
            text-decoration: underline;
        }
        
        /* Form Styles */
        .form-container {
            max-width: 700px;
            margin: 30px auto 0;
            padding: 25px;
            background-color: #fff8f0;
            border-radius: 8px;
            border: 1px solid #eaeaea;
        }
        
        .form-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        .form-control:focus {
            border-color: #ff7b00;
            outline: none;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .checkbox-group input {
            width: auto;
        }
        
        .form-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .btn-secondary {
            background-color: #f1f1f1;
            color: #333;
        }
        
        .btn-secondary:hover {
            background-color: #e0e0e0;
        }
    
        
        /* Responsive Styles */
        @media (max-width: 768px) {
            .address-list {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .page-title {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .form-buttons {
                flex-direction: column;
            }
            
            .content {
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .content {
                padding: 15px;
            }
            
            .page-title h1 {
                font-size: 24px;
            }
            
            .btn {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">LuxuryMall</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="main-content">
            <!-- Content Area -->
            <div class="content">
                <div class="page-title">
                    <h1>My Addresses</h1>
                    <button class="btn" id="addAddressBtn">Add New Address</button>
                </div>
                <div class="address-list" id="addressList"></div>
                <div class="form-container" id="addressForm" style="display: none;">
                    <h2>Add New Address</h2>
                    <form id="newAddressForm">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="addressLine1">Address Line 1</label>
                            <input type="text" id="addressLine1" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="addressLine2">Address Line 2 (Optional)</label>
                            <input type="text" id="addressLine2" class="form-control">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="state">State</label>
                                <input type="text" id="state" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="zipCode">PIN Code</label>
                                <input type="text" id="zipCode" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="country">Country</label>
                                <select id="country" class="form-control" required>
                                    <option value="IN">India</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="addressType">Address Type</label>
                            <select id="addressType" class="form-control">
                                <option value="home">Home</option>
                                <option value="office">Office</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="checkbox-group">
                            <input type="checkbox" id="setDefault">
                            <label for="setDefault">Set as default address</label>
                        </div>
                        
                        <div class="form-buttons">
                            <button type="submit" class="btn">Save Address</button>
                            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
    async function syncAddressesFromMongo() {
      const list = document.getElementById("addressList");
      list.innerHTML = "<p>Loading addresses...</p>";
    
      try {
        const res = await fetch(
          `https://luxrymoll.vercel.app/api/address?email=${encodeURIComponent(user.email)}`
        );
    
        const data = await res.json();
    
        if (!data.success || !Array.isArray(data.addresses)) {
          list.innerHTML = "<p>No address saved yet.</p>";
          return;
        }
    
        // ✅ Mongo → localStorage sync
        localStorage.setItem(ADDRESS_KEY, JSON.stringify(data.addresses));
    
        // ✅ Render
        loadAddresses();
    
      } catch (err) {
        console.error("Mongo sync failed:", err);
        list.innerHTML = "<p>Error loading addresses</p>";
      }
    }
    </script>
    <script>
    const user = JSON.parse(localStorage.getItem("luxuryUser"));
    if (!user || !user.email) {
      location.href = "index.html";
    }
    const ADDRESS_KEY = `addresses_${user.email.toLowerCase()}`;
    function loadAddresses() {
      const list = document.getElementById("addressList");
      const saved = JSON.parse(localStorage.getItem(ADDRESS_KEY)) || [];
      list.innerHTML = "";
      if (!saved.length) {
        list.innerHTML = "<p>No address saved yet.</p>";
        return;
      }
      saved.forEach(addr => {
        const card = document.createElement("div");
        card.className = "address-card";
        card.innerHTML = `
          <span class="address-type">${addr.type}</span>
          <h3>${addr.fullName}</h3>
          <p>${addr.address1}</p>
          <p>${addr.address2 || ""}</p>
          <p>${addr.city}, ${addr.state} - ${addr.zip}</p>
          <p>${addr.country}</p>
          <p>Phone: ${addr.phone}</p>
          <div class="address-actions">
            <button onclick="deleteAddress('${addr.addressId}')">Delete</button>
          </div>
        `;
        list.appendChild(card);
      });
    }
    function deleteAddress(addressId) {
      // Local delete
      let saved = JSON.parse(localStorage.getItem(ADDRESS_KEY)) || [];
      saved = saved.filter(addr => addr.addressId !== addressId);
      localStorage.setItem(ADDRESS_KEY, JSON.stringify(saved));
      loadAddresses();
    
      // Mongo delete
      fetch("https://luxrymoll.vercel.app/api/address", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: user.email,
          addressId,
          action: "delete"
        })
      }).catch(() => {});
    }
    
    /* ---------- ADD ADDRESS (LOCAL + MONGO) ---------- */
    document.getElementById("newAddressForm").addEventListener("submit", async function (e) {
      e.preventDefault();
    
      const newAddr = {
        addressId: "addr_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        fullName: fullName.value,
        phone: phone.value,
        address1: addressLine1.value,
        address2: addressLine2.value,
        city: city.value,
        state: state.value,
        zip: zipCode.value,
        country: country.value,
        type: addressType.value
      };
    
      // Save locally
      let saved = JSON.parse(localStorage.getItem(ADDRESS_KEY)) || [];
      saved.push(newAddr);
      localStorage.setItem(ADDRESS_KEY, JSON.stringify(saved));
      loadAddresses();
    
      // Save to Mongo
      fetch("https://luxrymoll.vercel.app/api/address", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: user.email,
          address: newAddr,
          action: "save"
        })
      }).catch(() => {});
    
      this.reset();
      addressForm.style.display = "none";
      addAddressBtn.style.display = "block";
    });
    
    /* ---------- UI TOGGLES ---------- */
    addAddressBtn.onclick = () => {
      addressForm.style.display = "block";
      addAddressBtn.style.display = "none";
    };
    
    cancelBtn.onclick = () => {
      addressForm.style.display = "none";
      addAddressBtn.style.display = "block";
    };
    syncAddressesFromMongo();
    </script>
</body>
</html>
