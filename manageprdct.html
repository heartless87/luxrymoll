<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing Manage | Luxurymoll</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }  
        body { background-color: #f8f9fa; color: #333; direction: ltr; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background-color: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08); overflow: hidden; }
        header { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; padding: 25px 30px; text-align: center; }
        header h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background-color: #f1f3f4;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2575fc;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .products-container {
            height: 600px;
            overflow-y: auto;
            padding: 15px;
        }
        
        .product-item {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #eaeaea;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .product-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }
        
        .product-image {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 25px;
            border: 1px solid #eee;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-details {
            flex-grow: 1;
            padding-right: 50px;
        }
        
        .product-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .product-description {
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
            max-height: 60px;
            overflow-y: auto;
        }
        
        .price-container {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }
        
        .original-price {
            font-size: 1.2rem;
            color: #888;
            text-decoration: line-through;
            margin-right: 15px;
        }
        
        .selling-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .edit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #3498db;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .edit-btn:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }
        
        .edit-form {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            z-index: 10;
            width: 350px;
            border: 1px solid #ddd;
        }
        
        .edit-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #444;
        }
        
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .save-btn, .cancel-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .save-btn {
            background-color: #2ecc71;
            color: white;
        }
        
        .cancel-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        .save-btn:hover {
            background-color: #27ae60;
        }
        
        .cancel-btn:hover {
            background-color: #c0392b;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #bdc3c7;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        @media (max-width: 768px) {
            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .product-image {
                width: 100%;
                height: 200px;
                margin-right: 0;
                margin-bottom: 20px;
            }
            
            .product-details {
                padding-right: 0;
            }
            
            .edit-form {
                width: calc(100% - 40px);
                right: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Product Listing Manager</h1>
            <p>Apne listed products ko manage aur edit karein</p>
        </header>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value">8</div>
                <div class="stat-label">Total Products</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">₹24,599</div>
                <div class="stat-label">Total Value</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">3</div>
                <div class="stat-label">On Discount</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">5</div>
                <div class="stat-label">In Stock</div>
            </div>
        </div>
        
        <div class="products-container" id="productsContainer">
        </div>
    </div>

    <script>
        const products = [
            {
                id: 1,
                title: "Wireless Bluetooth Headphones",
                description: "Noise cancelling wireless headphones with 30 hours battery life and comfortable ear cushions.",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 2999,
                sellingPrice: 1999
            },
            {
                id: 2,
                title: "Smart Watch Fitness Tracker",
                description: "Waterproof smartwatch with heart rate monitor, sleep tracking and multiple sports modes.",
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 8999,
                sellingPrice: 6499
            },
            {
                id: 3,
                title: "Premium Backpack",
                description: "Durable water-resistant backpack with laptop compartment and multiple pockets for organization.",
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 2499,
                sellingPrice: 1799
            },
            {
                id: 4,
                title: "Organic Cotton T-Shirt",
                description: "100% organic cotton t-shirt available in multiple colors, comfortable for daily wear.",
                image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 899,
                sellingPrice: 599
            },
            {
                id: 5,
                title: "Ceramic Coffee Mug Set",
                description: "Set of 4 handmade ceramic mugs with ergonomic handles and beautiful glaze finish.",
                image: "https://images.unsplash.com/photo-1514228742587-6b1558fcf93a?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 1599,
                sellingPrice: 1199
            },
            {
                id: 6,
                title: "Yoga Mat Premium",
                description: "Non-slip yoga mat with cushioning for joints, includes carrying strap and is eco-friendly.",
                image: "https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 1999,
                sellingPrice: 1499
            },
            {
                id: 7,
                title: "Desk Lamp with Wireless Charger",
                description: "LED desk lamp with adjustable brightness, wireless charging pad and USB ports.",
                image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 3499,
                sellingPrice: 2799
            },
            {
                id: 8,
                title: "Stainless Steel Water Bottle",
                description: "Insulated stainless steel water bottle that keeps drinks cold for 24 hours or hot for 12 hours.",
                image: "https://images.unsplash.com/photo-1523362628745-0c100150b504?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80",
                originalPrice: 1299,
                sellingPrice: 999
            }
        ];

        // Initialize the product listing
        document.addEventListener('DOMContentLoaded', function() {
            const productsContainer = document.getElementById('productsContainer');
            
            // Render all products
            products.forEach(product => {
                const productElement = createProductElement(product);
                productsContainer.appendChild(productElement);
            });
            
            // Update total value
            updateTotalValue();
        });

        // Create product element
        function createProductElement(product) {
            const productDiv = document.createElement('div');
            productDiv.className = 'product-item';
            productDiv.id = `product-${product.id}`;
            
            productDiv.innerHTML = `
                <div class="product-image">
                    <img src="${product.image}" alt="${product.title}">
                </div>
                <div class="product-details">
                    <h3 class="product-title">${product.title}</h3>
                    <p class="product-description">${product.description}</p>
                    <div class="price-container">
                        <span class="original-price">₹${product.originalPrice}</span>
                        <span class="selling-price">₹${product.sellingPrice}</span>
                    </div>
                </div>
                <button class="edit-btn" onclick="toggleEditForm(${product.id})">
                    <i class="fas fa-pencil-alt"></i>
                </button>
                <div class="edit-form" id="edit-form-${product.id}">
                    <h3>Edit Product</h3>
                    <div class="form-group">
                        <label for="title-${product.id}">Product Title</label>
                        <input type="text" id="title-${product.id}" value="${product.title}">
                    </div>
                    <div class="form-group">
                        <label for="description-${product.id}">Description</label>
                        <textarea id="description-${product.id}">${product.description}</textarea>
                    </div>
                    <div class="form-group">
                        <label for="original-price-${product.id}">Original Price (₹)</label>
                        <input type="number" id="original-price-${product.id}" value="${product.originalPrice}">
                    </div>
                    <div class="form-group">
                        <label for="selling-price-${product.id}">Selling Price (₹)</label>
                        <input type="number" id="selling-price-${product.id}" value="${product.sellingPrice}">
                    </div>
                    <div class="form-buttons">
                        <button class="save-btn" onclick="saveProduct(${product.id})">Save Changes</button>
                        <button class="cancel-btn" onclick="toggleEditForm(${product.id})">Cancel</button>
                    </div>
                </div>
            `;
            
            return productDiv;
        }

        // Toggle edit form visibility
        function toggleEditForm(productId) {
            const editForm = document.getElementById(`edit-form-${productId}`);
            const allEditForms = document.querySelectorAll('.edit-form');
            
            // Close all other open edit forms
            allEditForms.forEach(form => {
                if (form.id !== `edit-form-${productId}` && form.classList.contains('active')) {
                    form.classList.remove('active');
                }
            });
            
            // Toggle current form
            editForm.classList.toggle('active');
        }

        // Save product changes
        function saveProduct(productId) {
            const productIndex = products.findIndex(p => p.id === productId);
            if (productIndex === -1) return;
            
            // Get updated values
            const title = document.getElementById(`title-${productId}`).value;
            const description = document.getElementById(`description-${productId}`).value;
            const originalPrice = parseInt(document.getElementById(`original-price-${productId}`).value);
            const sellingPrice = parseInt(document.getElementById(`selling-price-${productId}`).value);
            
            // Update product data
            products[productIndex].title = title;
            products[productIndex].description = description;
            products[productIndex].originalPrice = originalPrice;
            products[productIndex].sellingPrice = sellingPrice;
            
            // Update UI
            const productElement = document.getElementById(`product-${productId}`);
            productElement.querySelector('.product-title').textContent = title;
            productElement.querySelector('.product-description').textContent = description;
            productElement.querySelector('.original-price').textContent = `₹${originalPrice}`;
            productElement.querySelector('.selling-price').textContent = `₹${sellingPrice}`;
            
            // Close edit form
            toggleEditForm(productId);
            
            // Update total value
            updateTotalValue();
            
            // Show success message
            alert('Product details updated successfully!');
        }

        // Update total value of all products
        function updateTotalValue() {
            const totalValue = products.reduce((total, product) => total + product.sellingPrice, 0);
            document.querySelector('.stat-value:nth-child(2)').textContent = `₹${totalValue.toLocaleString('en-IN')}`;
            
            // Update discount count
            const discountCount = products.filter(product => product.sellingPrice < product.originalPrice).length;
            document.querySelector('.stat-value:nth-child(3)').textContent = discountCount;
        }

        // Close edit form when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.edit-form') && !event.target.closest('.edit-btn')) {
                document.querySelectorAll('.edit-form').forEach(form => {
                    form.classList.remove('active');
                });
            }
        });
    </script>
</body>
</html>
